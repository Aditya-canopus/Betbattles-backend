<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Referral Code</title>
</head>
<body>
  <div style="width: 700px; margin: 0 auto;">
    <div style="background: #2f353a; padding: 15px; text-align: left;">
    </div>
    <div style="padding: 15px; text-align: center;">
      <strong style="font-size: 18px;">Dear {{name}},</strong>
      <p style="margin-top:5px;">Thank you for being a valued user! Here is your referral code:</p>
      <h2 style="color: #2f353a; font-size: 24px; margin: 20px 0;">{{referralCode}}</h2>
      <p>Share this code with your friends to invite them to join our platform!</p>
    </div>
  </div>
</body>
</html>
